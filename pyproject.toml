[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-route-audit"
version = "0.1.0"
description = "Offline TF topology and time-window diagnostics from exported ROS TransformStamped records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Afloat16"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Afloat16/tf-route-audit"
Issues = "https://github.com/Afloat16/tf-route-audit/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
tf-route-audit = "tf_route_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
